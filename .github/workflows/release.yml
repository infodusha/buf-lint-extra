name: Release

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  wasm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build Wasm plugin
        run: GOOS=wasip1 GOARCH=wasm go build -trimpath -ldflags="-s -w" -o buf-plugin-lint-extra.wasm ./cmd/buf-plugin-lint-extra
      - name: Write checksum
        run: sha256sum buf-plugin-lint-extra.wasm > buf-plugin-lint-extra.wasm.sha256
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" buf-plugin-lint-extra.wasm buf-plugin-lint-extra.wasm.sha256
