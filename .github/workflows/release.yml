name: Release

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  wasm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install buf
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
      - run: go test ./...
      - name: Build Wasm plugin
        run: GOOS=wasip1 GOARCH=wasm go build -trimpath -ldflags="-s -w" -o buf-plugin-lint-extra.wasm ./cmd/buf-plugin-lint-extra
      - name: Write checksum
        run: sha256sum buf-plugin-lint-extra.wasm > buf-plugin-lint-extra.wasm.sha256
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: buf-plugin-lint-extra.wasm
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG_NAME" buf-plugin-lint-extra.wasm buf-plugin-lint-extra.wasm.sha256

  bsr:
    needs: [release-please, wasm]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Download Wasm plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'buf-plugin-lint-extra.wasm*'
          sha256sum --check buf-plugin-lint-extra.wasm.sha256
      - name: Install buf
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
      - name: Push to the BSR
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: >-
          buf plugin push buf.build/infodusha/lint-extra
          --binary=buf-plugin-lint-extra.wasm
          --create
          --create-type=check
          --create-visibility=public
          --label=main
          --label="$TAG_NAME"
          --source-control-url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
